<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatórios | AutoGiro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="css/estilo.css" rel="stylesheet">
</head>
<body data-pagina="relatorios">
<div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="principal">
        <header class="topbar" id="topbar"></header>
        <section class="conteudo">
            <div class="cabecalho">
                <div>
                    <div class="overline">Análises</div>
                    <div class="linha-titulo">
                        <h1 class="titulo">Relatórios</h1>
                        <span class="tag" id="rotaAtual"></span>
                    </div>
                </div>
            </div>

            <div class="layout-relatorios">
                <nav class="card-cinza lista-relatorios" id="listaRelatorios">
                    <div class="overline px-2 pb-2">Consultas (JOIN)</div>
                </nav>

                <div>
                    <form class="card-cinza filtros-linha" id="formFiltros"></form>

                    <div class="visualizacao">
                        <div class="card-cinza">
                            <h2 class="card-titulo" id="tituloGrafico"></h2>
                            <div id="grafico"></div>
                        </div>
                        <div class="resumo" id="resumo"></div>
                    </div>

                    <div class="card-cinza card-tabela">
                        <table class="tabela">
                            <thead id="cabecalhoTabela"></thead>
                            <tbody id="lista"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script src="js/relatorios.js"></script>
</body>
</html>
