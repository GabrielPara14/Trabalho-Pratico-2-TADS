<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fabricantes | AutoGiro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="css/estilo.css" rel="stylesheet">
</head>
<body data-pagina="fabricantes">
<div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="principal">
        <header class="topbar" id="topbar"></header>
        <section class="conteudo">
            <div class="cabecalho">
                <div>
                    <div class="overline">Cadastro</div>
                    <div class="linha-titulo">
                        <h1 class="titulo">Fabricantes</h1>
                        <span class="tag" id="contador">0 registros</span>
                    </div>
                </div>
                <button class="btn-cheio" onclick="novoFabricante()">+ Adicionar fabricante</button>
            </div>

            <div class="layout-lista">
                <div class="card-cinza card-tabela">
                    <table class="tabela">
                        <thead>
                            <tr><th>ID</th><th>Nome</th><th>Veículos na frota</th><th></th></tr>
                        </thead>
                        <tbody id="lista"></tbody>
                    </table>
                </div>

                <form class="card-cinza filtros" id="formFiltros">
                    <h2>Filtrar</h2>
                    <div class="campo">
                        <label for="filtroNome">Nome</label>
                        <input id="filtroNome" placeholder="Ex.: Toyota">
                    </div>
                    <div class="campo">
                        <label for="filtroFrota">Veículos na frota</label>
                        <select id="filtroFrota">
                            <option value="">Todos</option>
                            <option value="com">Com veículos</option>
                            <option value="sem">Sem veículos</option>
                        </select>
                    </div>
                    <div class="campo">
                        <label for="filtroOrdem">Ordenar por</label>
                        <select id="filtroOrdem">
                            <option value="nome">Nome (A-Z)</option>
                            <option value="frota">Mais veículos</option>
                            <option value="id">ID</option>
                        </select>
                    </div>
                    <div class="botoes">
                        <button type="submit" class="btn-cheio">Aplicar</button>
                        <button type="button" class="btn-contorno" onclick="limparFiltros()">Limpar</button>
                    </div>
                </form>
            </div>
        </section>
    </main>
</div>

<!-- Gaveta lateral: cadastro e edição -->
<div class="offcanvas offcanvas-end gaveta" tabindex="-1" id="gaveta">
    <div class="offcanvas-header">
        <div>
            <div class="overline">Fabricante</div>
            <h5 class="offcanvas-title" id="tituloGaveta">Novo fabricante</h5>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
    </div>
    <form id="formFabricante" class="d-flex flex-column flex-grow-1">
        <div class="offcanvas-body">
            <p class="dica" id="dicaGaveta"></p>
            <div class="erro-form d-none mb-3" id="erroForm"></div>
            <input type="hidden" id="id">
            <div class="campo">
                <label for="nome">Nome</label>
                <input id="nome" maxlength="50" required placeholder="Ex.: Honda">
            </div>
        </div>
        <div class="rodape">
            <button type="button" class="btn-contorno" data-bs-dismiss="offcanvas">Cancelar</button>
            <button type="submit" class="btn-cheio">Salvar fabricante</button>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script src="js/fabricantes.js"></script>
</body>
</html>
