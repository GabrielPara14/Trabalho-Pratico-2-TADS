<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes | AutoGiro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="css/estilo.css" rel="stylesheet">
</head>
<body data-pagina="clientes">
<div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="principal">
        <header class="topbar" id="topbar"></header>
        <section class="conteudo">
            <div class="cabecalho">
                <div>
                    <div class="overline">Cadastro</div>
                    <div class="linha-titulo">
                        <h1 class="titulo">Clientes</h1>
                        <span class="tag" id="contador">0 registros</span>
                    </div>
                </div>
                <button class="btn-cheio" onclick="novoCliente()">+ Adicionar cliente</button>
            </div>

            <div class="layout-lista">
                <div class="card-cinza card-tabela">
                    <table class="tabela">
                        <thead>
                            <tr><th>Nome</th><th>CPF</th><th>E-mail</th><th>Aluguéis</th><th></th></tr>
                        </thead>
                        <tbody id="lista"></tbody>
                    </table>
                </div>

                <form class="card-cinza filtros" id="formFiltros">
                    <h2>Filtrar</h2>
                    <div class="campo">
                        <label for="filtroNome">Nome</label>
                        <input id="filtroNome" placeholder="Ex.: Ana">
                    </div>
                    <div class="campo">
                        <label for="filtroCpf">CPF</label>
                        <input id="filtroCpf" placeholder="Ex.: 123.456">
                    </div>
                    <div class="campo">
                        <label for="filtroEmail">E-mail</label>
                        <input id="filtroEmail" placeholder="Ex.: gmail.com">
                    </div>
                    <div class="campo">
                        <label for="filtroAluguel">Histórico</label>
                        <select id="filtroAluguel">
                            <option value="">Todos</option>
                            <option value="com">Já alugou</option>
                            <option value="sem">Nunca alugou</option>
                        </select>
                    </div>
                    <div class="botoes">
                        <button type="submit" class="btn-cheio">Aplicar</button>
                        <button type="button" class="btn-contorno" onclick="limparFiltros()">Limpar</button>
                    </div>
                </form>
            </div>
        </section>
    </main>
</div>

<div class="offcanvas offcanvas-end gaveta" tabindex="-1" id="gaveta">
    <div class="offcanvas-header">
        <div>
            <div class="overline">Cliente</div>
            <h5 class="offcanvas-title" id="tituloGaveta">Novo cliente</h5>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
    </div>
    <form id="formCliente" class="d-flex flex-column flex-grow-1">
        <div class="offcanvas-body">
            <p class="dica" id="dicaGaveta"></p>
            <div class="erro-form d-none mb-3" id="erroForm"></div>
            <input type="hidden" id="id">
            <div class="campo">
                <label for="nome">Nome completo</label>
                <input id="nome" required maxlength="100" placeholder="Ex.: Ana Souza">
            </div>
            <div class="campo">
                <label for="cpf">CPF</label>
                <input id="cpf" required maxlength="14" placeholder="000.000.000-00">
            </div>
            <div class="campo">
                <label for="email">E-mail</label>
                <input id="email" type="email" required placeholder="nome@email.com">
            </div>
        </div>
        <div class="rodape">
            <button type="button" class="btn-contorno" data-bs-dismiss="offcanvas">Cancelar</button>
            <button type="submit" class="btn-cheio">Salvar cliente</button>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script src="js/clientes.js"></script>
</body>
</html>
