<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aluguéis | AutoGiro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="css/estilo.css" rel="stylesheet">
</head>
<body data-pagina="alugueis">
<div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="principal">
        <header class="topbar" id="topbar"></header>
        <section class="conteudo">
            <div class="cabecalho">
                <div>
                    <div class="overline">Cadastro</div>
                    <div class="linha-titulo">
                        <h1 class="titulo">Aluguéis</h1>
                        <span class="tag" id="contador">0 registros</span>
                    </div>
                </div>
                <button class="btn-cheio" onclick="novoAluguel()">+ Registrar aluguel</button>
            </div>

            <div class="layout-lista">
                <div class="card-cinza card-tabela">
                    <table class="tabela">
                        <thead>
                            <tr><th>#</th><th>Cliente</th><th>Veículo</th><th>Período</th><th>Diária</th><th>Total</th><th>Situação</th><th></th></tr>
                        </thead>
                        <tbody id="lista"></tbody>
                    </table>
                </div>

                <form class="card-cinza filtros" id="formFiltros">
                    <h2>Filtrar</h2>
                    <div class="campo">
                        <label for="filtroCliente">Cliente</label>
                        <input id="filtroCliente" placeholder="Nome do cliente">
                    </div>
                    <div class="campo">
                        <label for="filtroVeiculo">Veículo</label>
                        <select id="filtroVeiculo"><option value="">Todos</option></select>
                    </div>
                    <div class="campo">
                        <label for="filtroSituacao">Situação</label>
                        <select id="filtroSituacao">
                            <option value="">Todas</option>
                            <option value="aberto">Em aberto</option>
                            <option value="devolvido">Devolvido</option>
                        </select>
                    </div>
                    <div class="campo">
                        <label>Início entre</label>
                        <div class="campo-duplo">
                            <input id="filtroDe" type="date">
                            <input id="filtroAte" type="date">
                        </div>
                    </div>
                    <div class="botoes">
                        <button type="submit" class="btn-cheio">Aplicar</button>
                        <button type="button" class="btn-contorno" onclick="limparFiltros()">Limpar</button>
                    </div>
                </form>
            </div>
        </section>
    </main>
</div>

<div class="offcanvas offcanvas-end gaveta" tabindex="-1" id="gaveta">
    <div class="offcanvas-header">
        <div>
            <div class="overline">Aluguel</div>
            <h5 class="offcanvas-title" id="tituloGaveta">Novo aluguel</h5>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
    </div>
    <form id="formAluguel" class="d-flex flex-column flex-grow-1">
        <div class="offcanvas-body">
            <p class="dica" id="dicaGaveta"></p>
            <div class="erro-form d-none mb-3" id="erroForm"></div>
            <input type="hidden" id="id">
            <div class="campo">
                <label for="clienteId">Cliente</label>
                <select id="clienteId" required></select>
            </div>
            <div class="campo">
                <label for="veiculoId">Veículo</label>
                <select id="veiculoId" required></select>
            </div>
            <div class="campo-duplo">
                <div class="campo">
                    <label for="dataInicio">Início</label>
                    <input id="dataInicio" type="date" required>
                </div>
                <div class="campo">
                    <label for="dataFimPrevista">Fim previsto</label>
                    <input id="dataFimPrevista" type="date" required>
                </div>
            </div>
            <div class="campo-duplo">
                <div class="campo">
                    <label for="valorDiaria">Valor da diária (R$)</label>
                    <input id="valorDiaria" type="number" step="0.01" min="0.01" max="10000" required>
                </div>
                <div class="campo">
                    <label for="quilometragemInicial">Km inicial</label>
                    <input id="quilometragemInicial" type="number" min="0" required>
                </div>
            </div>
            <p class="overline mt-2 mb-2">Devolução (preencha ao encerrar)</p>
            <div class="campo-duplo">
                <div class="campo">
                    <label for="dataDevolucao">Data de devolução</label>
                    <input id="dataDevolucao" type="date">
                </div>
                <div class="campo">
                    <label for="quilometragemFinal">Km final</label>
                    <input id="quilometragemFinal" type="number" min="0">
                </div>
            </div>
            <div class="campo">
                <label for="valorTotal">Valor total (R$)</label>
                <input id="valorTotal" type="number" step="0.01" min="0" placeholder="Calculado pelas diárias">
            </div>
        </div>
        <div class="rodape">
            <button type="button" class="btn-contorno" data-bs-dismiss="offcanvas">Cancelar</button>
            <button type="submit" class="btn-cheio">Salvar aluguel</button>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script src="js/alugueis.js"></script>
</body>
</html>
