<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veículos | AutoGiro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="css/estilo.css" rel="stylesheet">
</head>
<body data-pagina="veiculos">
<div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="principal">
        <header class="topbar" id="topbar"></header>
        <section class="conteudo">
            <div class="cabecalho">
                <div>
                    <div class="overline">Cadastro</div>
                    <div class="linha-titulo">
                        <h1 class="titulo">Veículos</h1>
                        <span class="tag" id="contador">0 registros</span>
                    </div>
                </div>
                <button class="btn-cheio" onclick="novoVeiculo()">+ Adicionar veículo</button>
            </div>

            <div class="layout-lista">
                <div class="card-cinza card-tabela">
                    <table class="tabela">
                        <thead>
                            <tr><th>Modelo</th><th>Placa</th><th>Fabricante</th><th>Ano</th><th>Quilometragem</th><th></th></tr>
                        </thead>
                        <tbody id="lista"></tbody>
                    </table>
                </div>

                <form class="card-cinza filtros" id="formFiltros">
                    <h2>Filtrar</h2>
                    <div class="campo">
                        <label for="filtroTexto">Modelo ou placa</label>
                        <input id="filtroTexto" placeholder="Ex.: Corolla">
                    </div>
                    <div class="campo">
                        <label for="filtroFabricante">Fabricante</label>
                        <select id="filtroFabricante"><option value="">Todos</option></select>
                    </div>
                    <div class="campo">
                        <label>Ano de fabricação</label>
                        <div class="campo-duplo">
                            <input id="filtroAnoMin" type="number" placeholder="de">
                            <input id="filtroAnoMax" type="number" placeholder="até">
                        </div>
                    </div>
                    <div class="campo">
                        <label for="filtroKm">Quilometragem até</label>
                        <input id="filtroKm" type="number" min="0" placeholder="Ex.: 50000">
                    </div>
                    <div class="botoes">
                        <button type="submit" class="btn-cheio">Aplicar</button>
                        <button type="button" class="btn-contorno" onclick="limparFiltros()">Limpar</button>
                    </div>
                </form>
            </div>
        </section>
    </main>
</div>

<div class="offcanvas offcanvas-end gaveta" tabindex="-1" id="gaveta">
    <div class="offcanvas-header">
        <div>
            <div class="overline">Veículo</div>
            <h5 class="offcanvas-title" id="tituloGaveta">Novo veículo</h5>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
    </div>
    <form id="formVeiculo" class="d-flex flex-column flex-grow-1">
        <div class="offcanvas-body">
            <p class="dica" id="dicaGaveta"></p>
            <div class="erro-form d-none mb-3" id="erroForm"></div>
            <input type="hidden" id="id">
            <div class="campo">
                <label for="modelo">Modelo</label>
                <input id="modelo" required placeholder="Ex.: Corolla XEi">
            </div>
            <div class="campo-duplo">
                <div class="campo">
                    <label for="placa">Placa</label>
                    <input id="placa" required maxlength="10" placeholder="ABC1D23">
                </div>
                <div class="campo">
                    <label for="anoFabricacao">Ano de fabricação</label>
                    <input id="anoFabricacao" type="number" min="1900" max="2100" required>
                </div>
            </div>
            <div class="campo">
                <label for="quilometragem">Quilometragem</label>
                <input id="quilometragem" type="number" min="0" required value="0">
            </div>
            <div class="campo">
                <label for="fabricanteId">Fabricante</label>
                <select id="fabricanteId" required></select>
            </div>
        </div>
        <div class="rodape">
            <button type="button" class="btn-contorno" data-bs-dismiss="offcanvas">Cancelar</button>
            <button type="submit" class="btn-cheio">Salvar veículo</button>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script src="js/veiculos.js"></script>
</body>
</html>
