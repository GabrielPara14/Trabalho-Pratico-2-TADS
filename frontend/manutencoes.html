<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manutenções | AutoGiro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="css/estilo.css" rel="stylesheet">
</head>
<body data-pagina="manutencoes">
<div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="principal">
        <header class="topbar" id="topbar"></header>
        <section class="conteudo">
            <div class="cabecalho">
                <div>
                    <div class="overline">Cadastro</div>
                    <div class="linha-titulo">
                        <h1 class="titulo">Manutenções</h1>
                        <span class="tag" id="contador">0 registros</span>
                        <span class="tag escura" id="totalGasto">R$ 0,00</span>
                    </div>
                </div>
                <button class="btn-cheio" onclick="novaManutencao()">+ Registrar manutenção</button>
            </div>

            <div class="layout-lista">
                <div class="card-cinza card-tabela">
                    <table class="tabela">
                        <thead>
                            <tr><th>Data</th><th>Veículo</th><th>Descrição</th><th>Km</th><th>Valor gasto</th><th></th></tr>
                        </thead>
                        <tbody id="lista"></tbody>
                    </table>
                </div>

                <form class="card-cinza filtros" id="formFiltros">
                    <h2>Filtrar</h2>
                    <div class="campo">
                        <label for="filtroVeiculo">Veículo</label>
                        <select id="filtroVeiculo"><option value="">Todos</option></select>
                    </div>
                    <div class="campo">
                        <label for="filtroDescricao">Descrição</label>
                        <input id="filtroDescricao" placeholder="Ex.: óleo">
                    </div>
                    <div class="campo">
                        <label>Valor gasto (R$)</label>
                        <div class="campo-duplo">
                            <input id="filtroValorMin" type="number" step="0.01" placeholder="mín.">
                            <input id="filtroValorMax" type="number" step="0.01" placeholder="máx.">
                        </div>
                    </div>
                    <div class="campo">
                        <label>Data entre</label>
                        <div class="campo-duplo">
                            <input id="filtroDe" type="date">
                            <input id="filtroAte" type="date">
                        </div>
                    </div>
                    <div class="botoes">
                        <button type="submit" class="btn-cheio">Aplicar</button>
                        <button type="button" class="btn-contorno" onclick="limparFiltros()">Limpar</button>
                    </div>
                </form>
            </div>
        </section>
    </main>
</div>

<div class="offcanvas offcanvas-end gaveta" tabindex="-1" id="gaveta">
    <div class="offcanvas-header">
        <div>
            <div class="overline">Manutenção</div>
            <h5 class="offcanvas-title" id="tituloGaveta">Nova manutenção</h5>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
    </div>
    <form id="formManutencao" class="d-flex flex-column flex-grow-1">
        <div class="offcanvas-body">
            <p class="dica" id="dicaGaveta"></p>
            <div class="erro-form d-none mb-3" id="erroForm"></div>
            <input type="hidden" id="id">
            <div class="campo">
                <label for="veiculoId">Veículo</label>
                <select id="veiculoId" required></select>
            </div>
            <div class="campo">
                <label for="descricao">Descrição</label>
                <textarea id="descricao" rows="3" required placeholder="Ex.: Troca de óleo e filtros"></textarea>
            </div>
            <div class="campo-duplo">
                <div class="campo">
                    <label for="dataManutencao">Data</label>
                    <input id="dataManutencao" type="date" required>
                </div>
                <div class="campo">
                    <label for="valorGasto">Valor gasto (R$)</label>
                    <input id="valorGasto" type="number" step="0.01" min="0" required>
                </div>
            </div>
            <div class="campo">
                <label for="quilometragemNaManutencao">Quilometragem na manutenção</label>
                <input id="quilometragemNaManutencao" type="number" min="0" required>
            </div>
        </div>
        <div class="rodape">
            <button type="button" class="btn-contorno" data-bs-dismiss="offcanvas">Cancelar</button>
            <button type="submit" class="btn-cheio">Salvar manutenção</button>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script src="js/manutencoes.js"></script>
</body>
</html>
